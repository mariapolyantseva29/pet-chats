<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<heaad>
    <meta charset="UTF-8">
    <title>Pet chat</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        #chat-box {
            height: 400px;
            overflow-y: scroll;
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            padding: 15px;
            border-radius: 5px;
        }
        .message {
            margin-bottom: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            background-color: #e9ecef;
        }
        .message.self {
            background-color: #d1e7dd;
            text-align: right;
        }
    </style>
</heaad>
<body class="container mt-5">
    <h2 class="mb-4">Чат ^-==-^</h2>
    <!-- Панель настроек -->
    <div class="row mb-3">
        <div class="col-mb-3">
            <label for="chatId" class="form-label">Chat ID:</label>
            <input type="number" id="chatId" class="form-control" value="1">
        </div>
        <div class="col-mb-3">
            <label for="senderId" class="form-label">Sender ID:</label>
            <input type="number" id="senderId" class="form-control" value="1">
        </div>
        <div class="col-md-3 d-flex align-items-end">
            <button id="connect-btn" class="btn btn-primary w-100" onclick="connect()">Подключиться</button>
        </div>
    </div>

    <!-- Область сообщений -->
    <div id="chat-box" class="mb-3"></div>

    <!-- Панель отправки сообщений -->
    <div class="input-group">
        <input type="text" id="message-input" class="form-control" placeholder="Введите сообщение..." disabled>
        <button id="send-btn" class="btn btn-success" onclick="sendMessage()" disabled>Отправить</button>
    </div>

    <!-- Подключаем SockJS и STOMP через CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

    <script>
        let stompClient = null;

        function connect() {
            const chatId = document.getElementById('chatId').value;
            if (!chatId) {
                alert('Укажите id чата');
                return;
            }

            // 1. Подключаемся к нашему эндпоинту WebSocketConfig (/ws-chat)
            const socket = new SockJS('ws-chat');
            stompClient = Stomp.over(socket);

            stompClient.connect({}, function (frame) {
                console.log('Connected: ' + frame);

                document.getElementById('message-input').disabled = false;
                document.getElementById('send-btn').disabled = false;
                document.getElementById('connect-btn').disabled = true;
                document.getElementById('chatId').disabled = true;

                // 2. Загружаем историю старых сообщений
                loadHistory(chatId);

                // 3. Подписываемся на топик конкретного чата
                stompClient.subscribe('/topic/chat/' + chatId, function (messageOutput) {
                    const message = JSON.parse(messageOutput.body);
                    displayMessage(message);
                });
            }, function(error) {
                alert('Ошибка подключения к WebSocket!');
            });
        }

        function loadHistory(chatId) {
            fetch('/api/chats/' + chatId + '/messages')
                .then(response => response.json())
                .then(messages => {
                    const chatBox = document.getElementById('chat-box');
                    chatBox.innerHTML = '';
                    messages.forEach(message => displayMessage(message));
                })
                .catch(err => console.error('Ошибка загрузки истории:', err));
        }

        function sendMessage() {
            const chatId = document.getElementById('chatId').value;
            const senderId = document.getElementById('senderId').value;
            const content = document.getElementById('message-input').value;

            if (!content.trim()) return;

            stompClient.send("/app/chat.send", {}, JSON.stringify({
                chatId: parseInt(chatId),
                senderId: parseInt(senderId),
                content: content
            }));

            document.getElementById('message-input').value = '';
        }

        function displayMessage(message) {
            const chatBox = document.getElementById('chat-box');
            const currentUserId = document.getElementById('senderId').value;

            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message');

            if (message.senderId == currentUserId) {
                messageDiv.classList.add('self');
            }

            const time = new Date(message.sentAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            messageDiv.innerHTML = `<strong>${message.senderUsername || ('User #' + message.senderId)}</strong> [${time}]:<br>${escapeHtml(message.content)}`;

            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
